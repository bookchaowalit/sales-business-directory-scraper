# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
# Replaces the previous standalone `ci` workflow (Ruff + offline pytest + dry-run smoke test), which this duplicates.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scraper:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
    with:
      # Matches the previous CI; the runtime is stdlib-only.
      python-version: "3.11"
      # Offline tests (fixtures and mocked provider only), then the dry-run plan smoke test the old CI ran.
      test-command: >-
        uv pip install pytest==9.1.1 &&
        python -m pytest -q &&
        python scripts/run_location_analysis.py --input fixtures/bangkapi_sample.json
        --radii 500,1000 --categories coffee,laundry --dry-run

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
