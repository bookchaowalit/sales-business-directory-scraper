[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-directory-scraping"
version = "0.2.0"
description = "Local business directory collection and bounded location opportunity analysis."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=7", "ruff==0.16.9", "mypy==2.4.0"]
# Opt-in error reporting for analysis runs (location_intelligence/observability.py); off without SENTRY_DSN.
sentry = ["sentry-sdk>=2.72,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["location_intelligence*"]

[tool.coverage.run]
source = ["location_intelligence", "scripts"]

[tool.mypy]
python_version = "3.10"
files = ["location_intelligence", "scripts", "tests"]
# scripts/ has no __init__.py; map it by path so scripts/x.py is "scripts.x".
explicit_package_bases = true
# Gradual: bodies are checked (check_untyped_defs) without requiring annotations
# everywhere. New modules are strict (override below); tighten the rest module by module.
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["location_intelligence.observability"]
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_reexport = true
warn_return_any = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["data"]

[tool.ruff.lint]
# Pin the rule set so newer ruff releases with wider defaults do not break CI.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Tests and runner scripts put the repository root on sys.path first.
"tests/*" = ["E402"]
"scripts/*" = ["E402"]
